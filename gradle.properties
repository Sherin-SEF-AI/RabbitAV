# JVM args sized for a 24-core dev box; lower -Xmx if building on a small machine.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Base URL for the opt-in events-only sync backend. Empty string disables sync
# entirely and hides the toggle in Settings (see core/data/sync).
rabbitav.syncBaseUrl=
